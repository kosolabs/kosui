name: Kosui CI
on:
  pull_request:
  workflow_call:
concurrency:
  group: ci-workflow-${{ github.workflow }}-ref-${{ github.ref }}
  # Cancel in-progress workflows for PRs (but not main).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main'}}
permissions:
  contents: read
jobs:
  npm:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm and node
        uses: ./.github/actions/setup-pnpm
      - run: pnpm test
      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/

  e2e-browser:
    name: e2e (${{ matrix.browser }} ${{ matrix.shard }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, shard: 1/1, workers: 100% }
          - { browser: firefox, shard: 1/1, workers: 100% }
          - { browser: webkit, shard: 1/2, workers: 2 }
          - { browser: webkit, shard: 2/2, workers: 2 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm and node
        uses: ./.github/actions/setup-pnpm
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps ${{ matrix.browser }}
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: pnpm test:e2e --project=${{ matrix.browser }} --shard=${{ matrix.shard }} --workers=${{ matrix.workers }}

  e2e:
    if: always()
    needs: e2e-browser
    runs-on: ubuntu-26.04
    steps:
      - run: test "${{ needs.e2e-browser.result }}" = success
