name: Kosui CI
on:
  pull_request:
  workflow_call:
concurrency:
  group: ci-workflow-${{ github.workflow }}-ref-${{ github.ref }}
  # Cancel in-progress workflows for PRs (but not main).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main'}}
permissions:
  contents: read
jobs:
  npm:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm and node
        uses: ./.github/actions/setup-pnpm
      - run: pnpm test
      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/

  e2e-linux:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
      env:
        pnpm_config_store_dir: /__w/.pnpm-store
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm and node
        uses: ./.github/actions/setup-pnpm
      - run: pnpm test:e2e --project=${{ matrix.browser }}

  e2e-webkit:
    name: e2e (webkit)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm and node
        uses: ./.github/actions/setup-pnpm
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-${{ steps.playwright.outputs.version }}
      - name: Install Playwright
        run: pnpm exec playwright install webkit
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: pnpm test:e2e --project=webkit

  e2e:
    if: always()
    needs: [e2e-linux, e2e-webkit]
    runs-on: ubuntu-26.04
    steps:
      - run: test "${{ needs.e2e-linux.result }}" = success && test "${{ needs.e2e-webkit.result }}" = success
