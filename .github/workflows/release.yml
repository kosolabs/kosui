name: Release

on:
  push:
    branches:
      - main
env:
  CI: true
concurrency:
  group: workflow-${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  deploy:
    # prevents this action from running on forks
    if: github.repository == 'kosolabs/kosui'
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    needs: build
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
  release:
    # prevents this action from running on forks
    if: github.repository == 'kosolabs/kosui'
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write # Required for OIDC
    needs: build
    environment:
      name: kosuinpm
      url: https://www.npmjs.com/package/kosui
    steps:
      - uses: actions/create-github-app-token@v3.3.0
        id: releaser-token
        with:
          client-id: Iv23liXdlxbyAb7jyk9P
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout code repository
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm and node
        uses: ./.github/actions/setup-pnpm
      - name: Create and publish versions
        uses: changesets/action@v2.1.2
        with:
          github-token: ${{ steps.releaser-token.outputs.token }}
          commit-message: "chore: update versions"
          pr-title: "chore: update versions"
          publish-script: pnpm ci:publish
