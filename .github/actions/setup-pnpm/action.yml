name: "Setup Pnpm"
description: "Setup Pnpm and node"
runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6.0.8
      with:
        package_json_file: package.json
    - name: Setup Node
      uses: actions/setup-node@v6.4.0
      with:
        node-version-file: .nvmrc
        cache: "pnpm"
        cache-dependency-path: pnpm-lock.yaml
    - name: Install dependencies (fail on warnings)
      shell: bash
      run: |
        pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/pnpm-install.log"
        if grep -E '\bWARN\b' "$RUNNER_TEMP/pnpm-install.log"; then
          echo "::error::pnpm install emitted warnings (see above); fix them before merging."
          exit 1
        fi
